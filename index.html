
<!DOCTYPE html>
<html lang="fr" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXEM IA — Votre partenaire IA, de A à Z.</title>
    <meta name="description" content="AXEM IA, agence d'IA & organisme de formation certifié Qualiopi. Audit, conseil, automatisation et formation IA pour les entreprises, administrations et particuliers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0F0F0F",
              "ink-2": "#161616",
              "ink-3": "#1E1E1E",
              cream: "#FAFAF7",
              "cream-soft": "#A8A8A2",
              "cream-dim": "#6E6E68",
              green: "#00FA9A",
              "green-deep": "#00B86F",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Archivo", "Inter", "sans-serif"],
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html { scroll-padding-top: 80px; background-color: #0F0F0F; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0F0F0F;
        color: #FAFAF7;
        overflow-x: hidden;
      }
      .font-display { font-family: 'Archivo', 'Inter', sans-serif; }
      ::selection { background: #00FA9A; color: #0F0F0F; }
      ::-moz-selection { background: #00FA9A; color: #0F0F0F; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* huge type kills its own tracking */
      .tight { letter-spacing: -0.04em; }
      .tighter { letter-spacing: -0.055em; }
      .outline-type {
        color: transparent;
        -webkit-text-stroke: 1.5px #FAFAF7;
      }
      .outline-green {
        color: transparent;
        -webkit-text-stroke: 1.5px #00FA9A;
      }
      @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
