
<!DOCTYPE html>
<html lang="fr" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXEM IA — Votre partenaire IA, de A à Z.</title>
    <meta name="description" content="AXEM IA, agence d'IA & organisme de formation certifié Qualiopi. Audit, conseil, automatisation et formation IA pour les entreprises, administrations et particuliers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // DA « BLEU NUIT » — mêmes noms de tokens que Playful, valeurs navy.
              // Structure/contenu inchangés : seule la logique de couleur bascule.
              cream: "#070B16",        // fond principal → bleu nuit profond
              "cream-2": "#0B1020",    // sections alternées → surface navy
              white: "#FFFFFF",        // pastilles logos (lisibilité sur sombre)
              ink: "#EAF0FF",          // texte principal → blanc cassé bleuté
              "ink-soft": "#9FB0CE",   // texte secondaire → gris-bleu clair
              "ink-dim": "#6E7FA0",    // texte tertiaire / méta
              // palette accents navy (ex-palette joyeuse remappée)
              mint: "#38BDF8",         // ex-mint → cyan
              "mint-deep": "#5BC8F8",  // cyan texte (lisible sur navy)
              coral: "#FF6B4A",        // POINTE chaude conservée (logo dot + soulignement hero)
              "coral-deep": "#3B6FE0", // bleu profond (icônes sur bouton clair)
              violet: "#5B8CFF",       // ex-violet → bleu électrique
              "violet-deep": "#9DB9FF",// bleu clair (texte accent sur navy)
              yellow: "#A5C0FF",       // ex-jaune → périwinkle clair (chips/stickers)
              "yellow-deep": "#8FB0FF",
              // alias historiques
              green: "#38BDF8",
              "green-deep": "#5B8CFF",
            },
            fontFamily: {
              sans: ["Hanken Grotesque", "Inter", "sans-serif"],
              display: ["Hanken Grotesque", "Inter", "sans-serif"],
            },
            borderRadius: {
              "4xl": "2rem",
              "5xl": "2.75rem",
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html { scroll-padding-top: 84px; background-color: #070B16; }
      body {
        font-family: 'Hanken Grotesque', 'Inter', sans-serif;
        background-color: #070B16;
        color: #EAF0FF;
        overflow-x: hidden;
      }
      .font-display { font-family: 'Hanken Grotesque', 'Inter', sans-serif; }
      ::selection { background: #5B8CFF; color: #070B16; }
      ::-moz-selection { background: #5B8CFF; color: #070B16; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* gros titres : tracking rond et serré mais friendly */
      .tight { letter-spacing: -0.025em; }
      .tighter { letter-spacing: -0.035em; }
      /* titre hero : mask-reveal mot-à-mot piloté en CSS (toujours lisible à la fin) */
      @keyframes riseword { from { transform: translateY(115%); } to { transform: translateY(0); } }
      .riseword { display: inline-block; transform: translateY(115%); animation: riseword 0.85s cubic-bezier(0.16,1,0.3,1) forwards; }
      /* contours façon sticker pour les mots accentués */
      .outline-type {
        color: transparent;
        -webkit-text-stroke: 2px #EAF0FF;
      }
      .outline-green {
        color: transparent;
        -webkit-text-stroke: 2px #38BDF8;
      }
      /* GLASS — surface verre dépoli navy (cartes sur fond sombre) */
      .glass {
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(120, 160, 255, 0.14);
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
      }
      /* QUADRILLAGE — grille fine navy fondue par masque radial (surtout hero) */
      .grid-overlay {
        background-image:
          linear-gradient(rgba(120,160,255,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120,160,255,0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(ellipse 92% 82% at 50% 42%, #000 38%, transparent 100%);
        mask-image: radial-gradient(ellipse 92% 82% at 50% 42%, #000 38%, transparent 100%);
      }
      .grid-overlay-soft {
        background-image:
          linear-gradient(rgba(120,160,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120,160,255,0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 45%, #000 30%, transparent 100%);
        mask-image: radial-gradient(ellipse 85% 75% at 50% 45%, #000 30%, transparent 100%);
      }
      /* ombres : profondeur noire + glows bleus discrets (ex-ombres colorées) */
      .shadow-soft { box-shadow: 0 18px 40px -20px rgba(0,0,0,0.55); }
      .shadow-mint { box-shadow: 0 18px 46px -18px rgba(56,189,248,0.28); }
      .shadow-coral { box-shadow: 0 18px 46px -18px rgba(91,140,255,0.28); }
      .shadow-violet { box-shadow: 0 18px 46px -18px rgba(91,140,255,0.30); }
      .shadow-yellow { box-shadow: 0 18px 46px -18px rgba(165,192,255,0.25); }
      @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
      @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      .floaty { animation: floaty 7s ease-in-out infinite; }
      /* respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        .floaty { animation: none !important; }
      }
      /* Calendly inline widget — keep it from overflowing on mobile */
      .calendly-inline-widget { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
