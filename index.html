
<!DOCTYPE html>
<html lang="fr" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXEM IA — Votre partenaire IA, de A à Z.</title>
    <meta name="description" content="AXEM IA, agence d'IA & organisme de formation certifié Qualiopi. Audit, conseil, automatisation et formation IA pour les entreprises, administrations et particuliers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              /* SOFT AURORA / GLASS — fond clair pastel, encre violette, accents violet + cyan */
              ink: "#FBF7FF",        /* fond clair de base (lavande très pâle) */
              "ink-2": "#FFFFFF",    /* surface claire (cartes) */
              "ink-3": "#F3ECFF",    /* surface claire alternée */
              cream: "#1A1230",      /* texte principal (violet-encre) */
              "cream-soft": "#5B5278", /* texte secondaire */
              "cream-dim": "#8E86A6",  /* texte tertiaire */
              green: "#A855F7",      /* accent principal (violet) */
              "green-deep": "#7C3AED", /* accent profond */
              cyan: "#38BDF8",       /* accent secondaire (cyan) */
              mint: "#5EEAD4",       /* touche mint */
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html { scroll-padding-top: 80px; background-color: #FBF7FF; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FBF7FF;
        color: #1A1230;
        overflow-x: hidden;
      }
      .font-display { font-family: 'Inter', sans-serif; }
      ::selection { background: #A855F7; color: #FFFFFF; }
      ::-moz-selection { background: #A855F7; color: #FFFFFF; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* huge type kills its own tracking */
      .tight { letter-spacing: -0.03em; }
      .tighter { letter-spacing: -0.04em; }
      /* titres en dégradé aurora (remplace l'outline sombre) */
      .aurora-text {
        background: linear-gradient(100deg, #A855F7 0%, #7C3AED 45%, #38BDF8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .outline-type {
        background: linear-gradient(100deg, #A855F7, #38BDF8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 0;
      }
      .outline-green {
        background: linear-gradient(100deg, #7C3AED, #38BDF8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 0;
      }
      /* GLASS — carte verre dépoli claire */
      .glass {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 8px 32px -12px rgba(124, 58, 237, 0.18), inset 0 1px 0 rgba(255,255,255,0.6);
      }
      .glass-strong {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(22px) saturate(1.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 12px 40px -14px rgba(124, 58, 237, 0.22), inset 0 1px 0 rgba(255,255,255,0.7);
      }
      /* AURORA BLOBS — dérive douce (transform/opacity only) */
      @keyframes drift1 {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        33%  { transform: translate3d(6%, 4%, 0) scale(1.08); }
        66%  { transform: translate3d(-4%, 7%, 0) scale(0.96); }
      }
      @keyframes drift2 {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        33%  { transform: translate3d(-7%, 5%, 0) scale(1.1); }
        66%  { transform: translate3d(5%, -5%, 0) scale(0.94); }
      }
      @keyframes drift3 {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50%  { transform: translate3d(4%, -6%, 0) scale(1.12); }
      }
      .aurora-blob { will-change: transform; mix-blend-mode: multiply; }
      .drift-1 { animation: drift1 22s ease-in-out infinite; }
      .drift-2 { animation: drift2 28s ease-in-out infinite; }
      .drift-3 { animation: drift3 25s ease-in-out infinite; }
      @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
      /* respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        .aurora-blob { animation: none !important; }
      }
      /* Calendly inline widget — keep it from overflowing on mobile */
      .calendly-inline-widget { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
