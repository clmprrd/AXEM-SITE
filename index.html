
<!DOCTYPE html>
<html lang="fr" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXEM IA — Votre partenaire IA, de A à Z.</title>
    <meta name="description" content="AXEM IA, agence d'IA & organisme de formation certifié Qualiopi. Audit, conseil, automatisation et formation IA pour les entreprises, administrations et particuliers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // surfaces claires (vibe playful)
              cream: "#FFFCF5",       // fond principal crème
              "cream-2": "#FFF7E8",   // crème un peu plus chaud (sections)
              white: "#FFFFFF",
              ink: "#161616",         // texte principal foncé
              "ink-soft": "#3C3A36",  // texte secondaire
              "ink-dim": "#7A766E",   // texte tertiaire / méta
              // palette joyeuse
              mint: "#00FA9A",
              "mint-deep": "#00C97D",
              coral: "#FF6B4A",
              "coral-deep": "#E8512F",
              violet: "#7C5CFF",
              "violet-deep": "#5E3DF0",
              yellow: "#FFD23F",
              "yellow-deep": "#F5BE00",
              // alias historiques → mappés vibe claire (contenu inchangé)
              green: "#00C97D",       // accent texte lisible sur crème
              "green-deep": "#00A867",
            },
            fontFamily: {
              sans: ["Hanken Grotesque", "Inter", "sans-serif"],
              display: ["Hanken Grotesque", "Inter", "sans-serif"],
            },
            borderRadius: {
              "4xl": "2rem",
              "5xl": "2.75rem",
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html { scroll-padding-top: 84px; background-color: #FFFCF5; }
      body {
        font-family: 'Hanken Grotesque', 'Inter', sans-serif;
        background-color: #FFFCF5;
        color: #161616;
        overflow-x: hidden;
      }
      .font-display { font-family: 'Hanken Grotesque', 'Inter', sans-serif; }
      ::selection { background: #FFD23F; color: #161616; }
      ::-moz-selection { background: #FFD23F; color: #161616; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* gros titres : tracking rond et serré mais friendly */
      .tight { letter-spacing: -0.025em; }
      .tighter { letter-spacing: -0.035em; }
      /* titre hero : mask-reveal mot-à-mot piloté en CSS (toujours lisible à la fin) */
      @keyframes riseword { from { transform: translateY(115%); } to { transform: translateY(0); } }
      .riseword { display: inline-block; transform: translateY(115%); animation: riseword 0.85s cubic-bezier(0.16,1,0.3,1) forwards; }
      /* contours façon sticker pour les mots accentués */
      .outline-type {
        color: transparent;
        -webkit-text-stroke: 2px #161616;
      }
      .outline-green {
        color: transparent;
        -webkit-text-stroke: 2px #00C97D;
      }
      /* ombres douces colorées réutilisables */
      .shadow-soft { box-shadow: 0 18px 40px -20px rgba(22,22,22,0.22); }
      .shadow-mint { box-shadow: 0 18px 42px -18px rgba(0,201,125,0.55); }
      .shadow-coral { box-shadow: 0 18px 42px -18px rgba(255,107,74,0.55); }
      .shadow-violet { box-shadow: 0 18px 42px -18px rgba(124,92,255,0.55); }
      .shadow-yellow { box-shadow: 0 18px 42px -18px rgba(245,190,0,0.55); }
      @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
      @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      .floaty { animation: floaty 7s ease-in-out infinite; }
      /* respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        .floaty { animation: none !important; }
      }
      /* Calendly inline widget — keep it from overflowing on mobile */
      .calendly-inline-widget { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
