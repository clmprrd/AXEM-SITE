
<!DOCTYPE html>
<html lang="fr" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXEM IA — Votre partenaire IA, de A à Z.</title>
    <meta name="description" content="AXEM IA, agence d'IA & organisme de formation certifié Qualiopi. Audit, conseil, automatisation et formation IA pour les entreprises, administrations et particuliers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // DARK LUXE / CINÉMATIQUE — tokens sémantiques conservés (ink/cream/green/font-display)
      // mais re-mappés sur une palette noir profond · ivoire · champagne-or.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0B0B0C",        // noir profond
              "ink-2": "#111113",    // surface 1
              "ink-3": "#181815",    // surface 2 (légère chaleur)
              cream: "#EDE9E0",      // ivoire
              "cream-soft": "#9C978B",// ivoire estompé
              "cream-dim": "#615E56",// ivoire très estompé
              green: "#D9B36A",      // accent champagne-or (alias conservé)
              "green-deep": "#A98438",// or profond
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ['"Fraunces"', "Georgia", "serif"],
              serif: ['"Instrument Serif"', "Georgia", "serif"],
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html { scroll-padding-top: 88px; background-color: #0B0B0C; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0B0B0C;
        color: #EDE9E0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* DARK LUXE : les titres deviennent serif raffiné (Fraunces).
         Léger optical-sizing pour un rendu éditorial/cinématique. */
      .font-display {
        font-family: 'Fraunces', Georgia, serif;
        font-optical-sizing: auto;
      }
      /* italique serif élégant pour accents éditoriaux */
      .serif-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; }
      ::selection { background: #D9B36A; color: #0B0B0C; }
      ::-moz-selection { background: #D9B36A; color: #0B0B0C; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* le serif respire — moins de resserrement que l'ancien grotesque */
      .tight { letter-spacing: -0.018em; }
      .tighter { letter-spacing: -0.026em; }
      /* petits caps · tracking large pour labels chapitres */
      .label-caps { letter-spacing: 0.34em; text-transform: uppercase; }
      .outline-type {
        color: transparent;
        -webkit-text-stroke: 1px #EDE9E0;
      }
      .outline-green {
        color: transparent;
        -webkit-text-stroke: 1px #D9B36A;
      }
      /* filet or 1px réutilisable */
      .hairline-gold { background: linear-gradient(90deg, transparent, rgba(217,179,106,0.55), transparent); }
      @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
      /* respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
      }
      /* Calendly inline widget — keep it from overflowing on mobile */
      .calendly-inline-widget { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
